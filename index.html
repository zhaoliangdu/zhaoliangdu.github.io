/* ============================================================
   🌐  Language & Render Logic
   ============================================================ */

let currentLang = 'zh';

function toggleLang() {
  currentLang = currentLang === 'zh' ? 'en' : 'zh';
  document.getElementById('lang-zh').classList.toggle('active', currentLang === 'zh');
  document.getElementById('lang-en').classList.toggle('active', currentLang === 'en');
  document.documentElement.lang = currentLang === 'zh' ? 'zh-CN' : 'en';
  renderAll();
}

function renderAll() {
  const data = CONFIG[currentLang];

  // Nav
  document.querySelectorAll('[data-nav]').forEach(el => {
    const key = el.getAttribute('data-nav');
    el.textContent = data.nav[key];
  });

  // Hero
  document.getElementById('hero-name').textContent = data.hero.name;
  document.getElementById('hero-title').textContent = data.hero.title;
  const tagsEl = document.getElementById('hero-tags');
  tagsEl.innerHTML = data.hero.tags.map(t => `<span class="hero-tag">${t}</span>`).join('');

  // Scroll hint
  document.getElementById('scroll-hint').textContent = data.scrollHint;

  // About
  document.getElementById('about-label').textContent = data.about.label;
  const aboutText = document.getElementById('about-text');
  aboutText.innerHTML = data.about.paragraphs.map(p => `<p>${p}</p>`).join('');
  const statsEl = document.getElementById('about-stats');
  statsEl.innerHTML = data.about.stats.map(s =>
    `<div class="stat-card"><div class="stat-number">${s.number}</div><div class="stat-label">${s.label}</div></div>`
  ).join('');

  // Skills
  document.getElementById('skills-label').textContent = data.skills.label;
  document.getElementById('skills-title').textContent = data.skills.title;
  document.getElementById('skills-subtitle').textContent = data.skills.subtitle;
  const skillsGrid = document.getElementById('skills-grid');
  skillsGrid.innerHTML = data.skills.items.map(item => `
    <div class="skill-card">
      <div class="skill-icon">${item.icon}</div>
      <h3 class="skill-title">${item.title}</h3>
      <p class="skill-desc">${item.desc}</p>
      <div class="skill-tags">${item.tags.map(t => `<span class="skill-tag">${t}</span>`).join('')}</div>
    </div>
  `).join('');

  // Projects
  document.getElementById('projects-label').textContent = data.projects.label;
  document.getElementById('projects-title').textContent = data.projects.title;
  document.getElementById('projects-subtitle').textContent = data.projects.subtitle;
  const projectsList = document.getElementById('projects-list');
  projectsList.innerHTML = data.projects.items.map(p => `
    <div class="project-card">
      <div class="project-thumb">${p.icon}</div>
      <div class="project-content">
        <h3>${p.title}</h3>
        <div class="project-meta">
          <span class="project-role">${p.role}</span>
          <span class="project-date">${p.date}</span>
        </div>
        <p class="project-desc">${p.desc}</p>
        <div class="project-tech">${p.tech.map(t => `<span>${t}</span>`).join('')}</div>
      </div>
    </div>
  `).join('');

  // Contact
  document.getElementById('contact-label').textContent = data.contact.label;
  document.getElementById('contact-title').textContent = data.contact.title;
  document.getElementById('contact-text').innerHTML = data.contact.text;
  const linksEl = document.getElementById('contact-links');
  linksEl.innerHTML = data.contact.links.map(l =>
    `<a class="contact-link" href="${l.url}" target="_blank" rel="noopener"><span class="icon">${l.icon}</span>${l.label}</a>`
  ).join('');
  document.getElementById('footer-text').textContent = data.contact.footer;

  // Re-trigger reveal animations
  setTimeout(() => {
    document.querySelectorAll('.reveal.active').forEach(el => {
      el.classList.remove('active');
      void el.offsetWidth;
    });
    initReveal();
  }, 50);
}

// ===== Scroll reveal =====
function initReveal() {
  const reveals = document.querySelectorAll('.reveal');
  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        entry.target.classList.add('active');
      }
    });
  }, { threshold: 0.1, rootMargin: '0px 0px -50px 0px' });
  reveals.forEach(el => observer.observe(el));
}

// ===== Smooth scroll =====
function scrollToSection(id) {
  document.getElementById(id).scrollIntoView({ behavior: 'smooth' });
}

document.querySelectorAll('a[href^="#"]').forEach(link => {
  link.addEventListener('click', (e) => {
    const href = link.getAttribute('href');
    if (href === '#') return;
    e.preventDefault();
    const target = document.querySelector(href);
    if (target) target.scrollIntoView({ behavior: 'smooth' });
  });
});

// ===== Mobile nav =====
function toggleMobileNav() {
  document.getElementById('mobileNav').classList.toggle('open');
}

// ===== Init =====
document.addEventListener('DOMContentLoaded', () => {
  renderAll();
  initReveal();
});
</script>
